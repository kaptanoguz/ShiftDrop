<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
<title>ShiftDrop balon</title>
<style>
  :root { --bg: rgba(255,255,255,.95); --shadow: rgba(10,20,40,.25); --muted: #8b8b92; }
  @media (prefers-color-scheme: dark) { :root { --bg: rgba(38,38,42,.95); --shadow: rgba(0,0,0,.55); --muted: #9a9aa2; } }
  html, body { margin: 0; width: 64px; height: 132px; overflow: hidden; background: transparent; user-select: none; }
  #tab {
    position: absolute; top: 16px; right: -30px; width: 76px; height: 100px; border-radius: 30px 0 0 30px;
    background: var(--bg); box-shadow: 0 10px 28px var(--shadow), inset 0 0 0 1px rgba(0,0,0,.05);
    display: flex; align-items: center; padding-left: 10px; box-sizing: border-box; cursor: ns-resize;
    transition: right 320ms cubic-bezier(.2,1.35,.4,1), transform 320ms cubic-bezier(.2,1.35,.4,1);
  }
  #logo { width: 34px; height: 34px; transition: transform 400ms cubic-bezier(.2,1.35,.4,1); }
  body:hover #tab { right: -14px; }
  body.hot #tab { right: -6px; transform: scale(1.08); }
  body.hot #logo { transform: rotate(-18deg) scale(1.15); }
  #pulse { position: absolute; inset: 0; border-radius: inherit; box-shadow: 0 0 0 0 rgba(42,134,255,.5); }
  body.hot #pulse { animation: pulse 900ms ease-out infinite; }
  @keyframes pulse { to { box-shadow: 0 0 0 14px rgba(42,134,255,0); } }
</style>
</head>
<body>
  <div id="tab" title="Dosyayı buraya sürükle"><div id="pulse"></div><div id="logo"></div></div>
<script src="icons.js"></script>
<script src="bubble.js"></script>
</body>
</html>
