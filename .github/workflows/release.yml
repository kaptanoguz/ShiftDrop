name: Derle ve yayınla

# main dalına kod gönderilince Linux ve Windows kurulumlarını derler ve package.json'daki
# sürüm numarasıyla (ör. v1.0.0) GitHub Releases sayfasına ekler. Aynı sürüm varsa dosyalar güncellenir.
# Actions sekmesinden elle de başlatılabilir.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, lang: tr, cmd: npm run dist:linux, files: "dist/*.AppImage\ndist/*.deb" }
          - { os: ubuntu-latest, lang: en, cmd: npm run dist:linux:en, files: "dist/*.AppImage\ndist/*.deb" }
          - { os: windows-latest, lang: tr, cmd: npm run dist:win, files: dist/ShiftDrop-*.exe }
          - { os: windows-latest, lang: en, cmd: npm run dist:win:en, files: dist/ShiftDrop-*.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
        if: runner.os == 'Linux' && matrix.lang == 'tr'
      - run: ${{ matrix.cmd }}
      - uses: actions/upload-artifact@v4
        with:
          name: shiftdrop-${{ runner.os }}-${{ matrix.lang }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: ver
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ShiftDrop ${{ steps.ver.outputs.tag }}
          make_latest: true
          files: out/*
          body: |
            | | English | Türkçe |
            |---|---|---|
            | **Windows installer** | `ShiftDrop-Setup-*.exe` | `ShiftDrop-Kurulum-*.exe` |
            | **Windows portable** | `ShiftDrop-Portable-*.exe` | `ShiftDrop-Tasinabilir-*.exe` |
            | **Linux AppImage** | `ShiftDrop-*-EN.AppImage` | `ShiftDrop-*-TR.AppImage` |
            | **Linux .deb** (Ubuntu, Mint, Debian) | `shiftdrop_*_en_amd64.deb` | `shiftdrop_*_tr_amd64.deb` |

            The language only sets the default; you can switch it any time from the tray menu (Language / Dil).
            Linux AppImage: `chmod +x ShiftDrop-*.AppImage` and run it.
            Linux .deb: `sudo apt install ./shiftdrop_*_amd64.deb`, then open ShiftDrop from the app menu.
