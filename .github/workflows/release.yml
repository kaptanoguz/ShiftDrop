name: Derle ve yayınla

# main dalına kod gönderilince Linux ve Windows kurulumlarını derler ve package.json'daki
# sürüm numarasıyla (ör. v1.0.0) GitHub Releases sayfasına ekler. Aynı sürüm varsa dosyalar güncellenir.
# Actions sekmesinden elle de başlatılabilir.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cmd: npm run dist:linux -- --publish never
            files: dist/*.AppImage
          - os: windows-latest
            cmd: npm run dist:win -- --publish never
            files: dist/ShiftDrop-*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
        if: runner.os == 'Linux'
      - run: ${{ matrix.cmd }}
      - uses: actions/upload-artifact@v4
        with:
          name: shiftdrop-${{ runner.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: ver
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ShiftDrop ${{ steps.ver.outputs.tag }}
          make_latest: true
          files: out/*
          body: |
            **Windows:** `ShiftDrop-Kurulum-*.exe` (kurulum) veya `ShiftDrop-Tasinabilir-*.exe` (kurulumsuz).
            **Linux:** `ShiftDrop-*.AppImage` dosyasını indir, `chmod +x` ile çalıştırılabilir yap ve aç.
