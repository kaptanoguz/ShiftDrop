name: Derle ve yayınla

# v ile başlayan bir etiket gönderilince (ör. v1.0.0) Linux ve Windows kurulumlarını
# derler ve GitHub Releases sayfasına ekler. Actions sekmesinden elle de başlatılabilir.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cmd: npm run dist:linux -- --publish never
            files: dist/*.AppImage
          - os: windows-latest
            cmd: npm run dist:win -- --publish never
            files: dist/ShiftDrop-*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
        if: runner.os == 'Linux'
      - run: ${{ matrix.cmd }}
      - uses: actions/upload-artifact@v4
        with:
          name: shiftdrop-${{ runner.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: ShiftDrop ${{ github.ref_name }}
          files: out/*
          body: |
            **Windows:** `ShiftDrop-Kurulum-*.exe` (kurulum) veya `ShiftDrop-Tasinabilir-*.exe` (kurulumsuz).
            **Linux:** `ShiftDrop-*.AppImage` dosyasını indir, `chmod +x` ile çalıştırılabilir yap ve aç.
